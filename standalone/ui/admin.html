<script>
(function(){
const root=document.getElementById('rental-demo-27'),app=root.querySelector('#rd-app');
let csrfToken='',readOnly=true;
const dateMY=d=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kuala_Lumpur',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);return ['year','month','day'].map(k=>p.find(x=>x.type===k).value).join('-');};
const today=()=>dateMY(new Date());
const later=()=>dateMY(new Date(Date.now()+90*86400000));
const fresh=(id,name,domain)=>({id,name,domain,until:later(),status:'active',color:'#b49354',deepColor:'#123f67',aquaColor:'#b8deef',language:'三语',ai:false,ledger:[],members:[],hidden:[],headline:'Welcome',subtitle:'',brandTitle:'',logo:'seven',cover:'premium',marketing:window.RentalMarketing.create(),aiAccess:window.RentalAI.create()});
let tenants=[],selected='',view='hq',creating=false,category='全部',authMode='',next=3,adminTab='overview',reportOpen=false,frontPage='home';
let logs=[],notice='',identity={owner:false,userId:''},assignments=[],saving=false,pendingRequest=null,modelText='',importing=false,advancedOpen=false,themeDraft=null;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=x=>new Intl.NumberFormat('en-MY',{style:'currency',currency:'MYR'}).format(x/100);
const t=()=>tenants.find(x=>x.id===selected)||tenants[0];
const status=x=>x.until<today()?'expired':x.status;
const stateName=x=>({active:'配置启用',paused:'暂停',draft:'草稿',expired:'已到期'}[status(x)]);
const btn=(label,action,id='',cls='')=>'<button type="button" class="cursor-interaction '+cls+'" data-action="'+action+'"'+(id?' data-id="'+esc(id)+'"':'')+'>'+label+'</button>';
const badge=x=>'<span class="badge '+status(x)+'">'+stateName(x)+'</span>';
function log(text){logs.unshift({time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),text});}
function header(){return '<header class="bar"><div class="brand"><div><b>Master7 总部</b><div class="small">独立管理后台 <span class="version">2027</span></div></div></div><nav aria-label="总部页面">'+(identity.owner?btn('全部客户','view-hq','',view==='hq'?'active':''):'')+btn('客户配置','view-tenant','',view==='tenant'?'active':'')+btn('看首页','view-front','',view==='front'?'active':'')+btn('退出','logout')+'</nav></header>';}
function options(){return tenants.map(x=>'<option value="'+esc(x.id)+'"'+(x.id===selected?' selected':'')+'>'+esc(x.name)+'</option>').join('');}
function picker(){return '<label class="small">选择客户平台<select id="rd-select">'+options()+'</select></label>';}
function form(create){const x=t();return '<section class="panel gap"><h3>'+ (create?'复制模板，开新平台':'品牌与租期设置')+'</h3><form id="'+(create?'rd-create':'rd-settings')+'"><div class="formgrid"><label>客户名称<input name="name" required maxlength="40" value="'+(create?'':esc(x.name))+'" placeholder="例如：客户 C"></label><label>拟用网址（尚未绑定）<input name="domain" required maxlength="100" value="'+(create?'':esc(x.domain))+'" placeholder="client-c.example"></label><label>租期结束日期<input name="until" type="date" required value="'+(create?later():x.until)+'"'+(create?' min="'+today()+'"':'')+'></label><label>语言标签（样位）<select name="language">'+['三语','中文','English','Bahasa Melayu'].map(z=>'<option'+(!create&&z===x.language?' selected':'')+'>'+z+'</option>').join('')+'</select></label>'+(create?'<label>金色／点缀颜色<input name="color" type="color" value="#b49354"></label>':'')+'<label>首页标题<input name="headline" maxlength="60" value="'+(create?'Welcome':esc(x.headline))+'"></label><label>首页副标题<input name="subtitle" maxlength="100" value="'+(create?'':esc(x.subtitle))+'"></label><label>前台品牌名（可留空）<input name="brandTitle" maxlength="40" value="'+(create?'':esc(x.brandTitle))+'"></label><label>前台 Logo<select name="logo"><option value="seven"'+((create||x.logo==='seven')?' selected':'')+'>新版数字 7</option><option value="none"'+(!create&&x.logo==='none'?' selected':'')+'>不显示 Logo</option></select></label><label>封面风格<select name="cover"><option value="premium"'+((create||x.cover==='premium')?' selected':'')+'>流光玻璃</option><option value="classic"'+(!create&&x.cover==='classic'?' selected':'')+'>极简建筑</option></select></label><label>平台状态<select name="status">'+['active','paused','draft'].map(z=>'<option value="'+z+'"'+((create?z==='active':x.status===z)?' selected':'')+'>'+({active:'配置启用',paused:'暂停',draft:'草稿'}[z])+'</option>').join('')+'</select></label></div><p class="small gap">'+(create?'复制外观与设置；会员和账目从空白开始，AI 默认关闭。':'改动保存到独立后台；网址尚未绑定。租期和平台状态由总部管理。')+'</p><div class="error" id="rd-error" role="alert"></div><div class="tools"><button class="primary cursor-interaction" type="submit">'+(create?'保存新客户':'保存设置')+'</button>'+(create?btn('取消','cancel-create'):'')+'</div></form></section>';}
function hq(){return '<div class="row"><div><h2>客户平台</h2><span class="muted">保存客户配置，复制品牌模板，管理各客户权限。</span></div>'+'<div class="tools">'+btn('＋ 创建客户','create','','primary')+'</div>'+'</div><div class="grid"><div class="panel"><span class="small">演示平台</span><span class="stat">'+tenants.length+'</span></div><div class="panel"><span class="small">配置启用</span><span class="stat">'+tenants.filter(x=>status(x)==='active').length+'</span></div><div class="panel"><span class="small">AI 选配开启</span><span class="stat">'+tenants.filter(x=>x.ai).length+'</span></div></div><div class="tenantlist">'+tenants.map(x=>'<article class="tenant"><div class="tenant-info"><div class="tenant-name">'+esc(x.name)+' '+badge(x)+'</div><div class="small">'+esc(x.domain)+' · 未绑定域名</div><div class="small">到期 '+esc(x.until)+' · AI '+(x.ai?'选配开启':'关闭')+'</div></div><div class="tools">'+btn('客户后台','manage',x.id)+btn('看效果','preview',x.id)+btn('改颜色','theme-open',x.id)+btn('复制配置','clone',x.id,'gold')+btn(x.status==='paused'?'恢复':'暂停','pause',x.id)+'</div></article>').join('')+'</div>'+(creating?form(true):'')+'<div class="two"><section class="panel"><h3>样板配置</h3><div class="planrow"><span>主题</span><span>水蓝 · 深蓝 · 金色</span></div><div class="planrow"><span>注册方式</span><span>手机 / 邮箱</span></div><div class="planrow"><span>AI 客服</span><span>默认关闭，按需添加</span></div><div class="planrow"><span>游戏目录</span><span>以后按原平台核对</span></div><div class="planrow"><span>配置保存</span><span>独立数据库</span></div><div class="planrow"><span>Android APK</span><span>待正式开发</span></div></section><section class="panel"><h3>后台操作记录</h3>'+logs.slice(0,5).map(l=>'<div class="log"><span class="small">'+esc(l.time)+'</span> '+esc(l.text)+'</div>').join('')+'</section></div>'+workspaceTools();}
function ledger(x){const total=x.ledger.reduce((a,l)=>a+l.cents,0);return '<section class="panel"><div class="row"><h3>演示账目</h3>'+btn('添加示例记录','sample','','gold')+'</div><p class="small">仅示例数据，无真实资金；余额 '+money(total)+'</p><div class="scroll"><table><thead><tr><th>流水</th><th>类别</th><th class="money">金额</th><th>状态</th></tr></thead><tbody>'+ (x.ledger.length?x.ledger.map((l,i)=>'<tr><td>DEMO-'+String(i+1).padStart(3,'0')+'</td><td>'+esc(l.label)+'</td><td class="money">'+money(l.cents)+'</td><td>模拟记账</td></tr>').join(''):'<tr><td colspan="4">此客户没有示例记录。复制模板不会带走别人的账目。</td></tr>')+'</tbody></table></div></section>';}
function tenantOverview(){const x=t();return '<div class="row"><div><h2>'+esc(x.name)+'</h2>'+badge(x)+'</div>'+picker()+'</div><div class="grid"><div class="panel"><span class="small">演示会员</span><span class="stat">'+x.members.length+'</span></div><div class="panel"><span class="small">演示钱包</span><span class="stat">'+money(x.ledger.reduce((a,l)=>a+l.cents,0))+'</span></div><div class="panel"><span class="small">租期结束</span><span class="stat" style="font-size:20px">'+esc(x.until)+'</span></div></div>'+ledger(x)+'<div class="two"><section class="panel"><h3>AI 客服选配</h3><label class="check"><input id="rd-ai" type="checkbox" '+(x.ai?'checked':'')+'><span>为这个客户开启 AI 演示</span></label><p class="small gap">模拟问答，不调用外部 AI，不收集密钥。</p>'+btn('试一下客服','ai-test','','gold')+'<div id="rd-answer" class="note">客户需要时才添加。</div></section><section class="panel"><h3>接口与安全</h3><div class="planrow"><span>游戏 API</span><span>尚未连接</span></div><div class="planrow"><span>支付网关</span><span>尚未连接</span></div><div class="planrow"><span>短信 / 邮件验证</span><span>尚未连接</span></div><div class="planrow"><span>资金审核 / 风控</span><span>待正式实现</span></div><div class="planrow"><span>客户数据隔离</span><span>服务器按账号检查权限</span></div></section></div>'+form(false);}

function memberPanel(x){return '<section class="panel"><div class="row"><h3>演示会员管理</h3><div class="tools">'+btn('模拟手机注册','member-add','phone','gold')+btn('模拟邮箱注册','member-add','email')+'</div></div><p class="small">只生成虚构会员，不填写个人信息；无真实短信或邮箱验证。</p><div class="scroll"><table><thead><tr><th>会员</th><th>注册方式</th><th>状态</th><th>操作</th></tr></thead><tbody>'+(x.members.length?x.members.map(m=>'<tr><td>'+esc(m.alias)+'</td><td>'+ (m.method==='phone'?'手机':'邮箱')+'</td><td>'+ (m.active?'演示启用':'演示停用')+'</td><td>'+btn(m.active?'停用':'恢复','member-toggle',m.id)+'</td></tr>').join(''):'<tr><td colspan="4">这个客户还没有演示会员。</td></tr>')+'</tbody></table></div></section>';}
function reportText(x){return ['演示报表，无真实资金','客户：'+x.name,'演示平台：'+x.domain,'币种：MYR','类别,金额,状态',...x.ledger.map(l=>l.label+','+(l.cents/100).toFixed(2)+',模拟记账'),'净变动,'+(x.ledger.reduce((a,l)=>a+l.cents,0)/100).toFixed(2)].join('\n');}
function reportPanel(x){const incoming=x.ledger.filter(l=>l.cents>0).reduce((a,l)=>a+l.cents,0),out=-x.ledger.filter(l=>l.cents<0).reduce((a,l)=>a+l.cents,0);return '<section class="panel"><div class="row"><h3>演示账目报表</h3>'+btn('报表文本预览','report-open','','gold')+'</div><p class="small">根据当前客户的示例流水计算。净变动不是经营利润。</p><div class="grid"><div><span class="small">示例入账</span><strong class="stat">'+money(incoming)+'</strong></div><div><span class="small">示例出账</span><strong class="stat">'+money(out)+'</strong></div><div><span class="small">净变动</span><strong class="stat">'+money(incoming-out)+'</strong></div></div><div class="planrow"><span>演示会员</span><span>'+x.members.length+'</span></div><div class="planrow"><span>示例流水数量</span><span>'+x.ledger.length+'</span></div><div class="planrow"><span>游戏收入与供应商成本</span><span>等待 API 数据</span></div><div class="planrow"><span>经营净利润</span><span>等待完整费用数据</span></div>'+(reportOpen?'<label class="gap">可复制的演示报表<textarea readonly rows="9" style="width:100%;font:inherit;border:1px solid #cbdbe8;border-radius:9px;padding:12px;background:#f0f8fd;color:#16304d">'+esc(reportText(x))+'</textarea></label>':'')+'</section>';}
function gamePanel(x){return '<section class="panel"><div class="row"><h3>游戏目录管理</h3>'+btn('查看前台效果','view-front','','gold')+'</div><p class="small">你提供的游戏资源以后统一接入。这里先管理样板入口显示，不代表游戏已接通。</p><div class="scroll"><table><thead><tr><th>占位入口</th><th>分类</th><th>连接</th><th>前台显示</th></tr></thead><tbody>'+games.map((g,i)=>'<tr><td>'+g.name+'</td><td>'+g.cat+'</td><td>等待 API</td><td>'+btn(x.hidden.includes(i)?'隐藏 · 点击显示':'显示 · 点击隐藏','game-toggle',String(i))+'</td></tr>').join('')+'</tbody></table></div></section>';}
function themePanel(x){const palette=themeDraft?.tenantId===x.id?themeDraft.values:window.RentalTheme.colors(x);return '<section class="panel gap"><div class="row"><h3>自己改平台颜色</h3>'+picker()+'</div><p class="small">调整水蓝、深蓝和金色，可即时看效果。只保存到所选客户；总部可以管理全部客户。</p><form id="rd-theme"><div class="theme-grid">'+[['aquaColor','水蓝／页面底色'],['deepColor','深蓝／导航主色'],['color','金色／按钮点缀']].map(([key,label])=>'<label>'+label+'<input type="color" name="'+key+'" data-theme-color="'+key+'" value="'+esc(palette[key])+'"></label>').join('')+'</div><div class="theme-sample"><div><strong>PREMIUM EXPERIENCE</strong><div class="small">颜色效果预览</div></div><span class="badge" style="background:var(--theme-gold);color:var(--theme-on-gold)">SEVEN</span></div><p class="small gap" id="rd-theme-state" role="status">'+(themeDraft?'正在预览，还未保存。满意后按“保存颜色”。':'当前显示已保存的配色。')+'</p><div class="tools"><button type="submit" class="primary">保存颜色</button>'+btn('恢复蓝金默认','theme-reset')+btn('取消预览','theme-cancel')+'</div><p class="small gap">选色影响页面底色、导航、卡片和按钮。封面图片和 Logo 由品牌设置选择。</p></form></section>';}
function settingsPanel(x){return themePanel(x)+form(false)+'<section class="panel gap"><h3>AI 客服选配</h3><label class="check"><input id="rd-ai" type="checkbox" '+(x.ai?'checked':'')+'><span>为当前客户开启 AI 演示</span></label><p class="small gap">客户需要时才添加，正式 API 以后连接。</p>'+btn('试一下客服','ai-test','','gold')+'<div class="note" id="rd-answer">仅模拟问答，不发送外部请求。</div></section>';}

async function fetchAPI(payload){const response=await fetch('/api/control',payload?{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Platform-Request':'1','X-CSRF-Token':csrfToken},body:JSON.stringify(payload)}:{credentials:'same-origin',cache:'no-store'});let data;try{data=await response.json();}catch{throw new Error('后台没有返回有效内容，请重新载入。');}if(!response.ok){const error=new Error(data.error||'操作失败，请稍后重试。');error.status=response.status;throw error;}return data;}
function receive(data){csrfToken=data.csrfToken||csrfToken;readOnly=data.readOnly!==false;if(pendingRequest&&pendingRequest.userId!==data.identity.userId){pendingRequest=null;stashPending();}tenants=data.tenants;logs=data.logs;assignments=data.assignments;identity=data.identity;if(data.selected&&tenants.some(x=>x.id===data.selected))selected=data.selected;if(!tenants.some(x=>x.id===selected))selected=tenants[0]?.id||'';if(!identity.owner&&view==='hq')view='tenant';}
function showError(error){const box=root.querySelector('#rd-network-status');if(box)box.innerHTML='<div class="note" role="alert">'+esc(error.message||'保存失败，请重试。')+' 内容尚未清空。</div>'+(pendingRequest?btn('确认上次保存','retry-pending','','gold'):'');else app.innerHTML='<main><section class="panel"><h2>后台暂未载入</h2><p role="alert">'+esc(error.message)+'</p><a href="/login" target="_top">登录后重新打开</a><div class="tools gap">'+btn('重试载入','reload')+'</div></section></main>';}
function stashPending(){try{if(pendingRequest)sessionStorage.setItem('platform.pending.v2',JSON.stringify({userId:identity.userId,...pendingRequest}));else sessionStorage.removeItem('platform.pending.v2');}catch{}}
function restorePending(){if(pendingRequest)return;try{const stored=JSON.parse(sessionStorage.getItem('platform.pending.v2')||'null');if(stored&&stored.userId===identity.userId&&typeof stored.payload?.requestKey==='string'&&typeof stored.signature==='string'){const {requestKey,...base}=stored.payload;if(JSON.stringify(base)===stored.signature)pendingRequest={userId:identity.userId,signature:stored.signature,payload:stored.payload};}}catch{}}
async function operate(action,extra={},target=selected,replay=false){
if(saving)return null;
if(readOnly){showError(new Error('当前为只读预览，尚未启用保存。'));return null;}
let base={action,tenantId:target,revision:tenants.find(x=>x.id===target)?.revision,...extra};
if(replay&&pendingRequest){const {requestKey,...saved}=pendingRequest.payload;base=saved;}
const signature=JSON.stringify(base);if(pendingRequest&&pendingRequest.signature!==signature){showError(new Error('上次保存结果尚未确认，请先按“确认上次保存”，再进行新操作。'));return null;}
saving=true;app.setAttribute('aria-busy','true');const disabled=Array.from(root.querySelectorAll('button,input,select,textarea')).map(el=>[el,el.disabled]);disabled.forEach(([el])=>el.disabled=true);
if(!pendingRequest||pendingRequest.signature!==signature)pendingRequest={userId:identity.userId,signature,payload:{...base,requestKey:crypto.randomUUID()}};stashPending();
try{const data=await fetchAPI(pendingRequest.payload);pendingRequest=null;stashPending();if(data.tenants)receive(data);notice=data.notice||'操作已保存。';return data;}catch(error){if(error.status&&error.status<500)pendingRequest=null;stashPending();showError(error);return null;}finally{saving=false;app.removeAttribute('aria-busy');disabled.forEach(([el,was])=>el.disabled=was);}}
async function load(){if(saving)return;saving=true;try{const data=await fetchAPI();receive(data);restorePending();themeDraft=null;notice=readOnly?'':'已载入客户配置。';if(pendingRequest)notice+=' 上次保存还需确认。';render();}catch(error){showError(error);}finally{saving=false;}}
function validate(data,exclude){const name=String(data.get('name')||'').trim(),domain=String(data.get('domain')||'').trim().toLowerCase(),until=String(data.get('until')||''),color=String(data.get('color')||'#b49354'),language=String(data.get('language')||'三语'),st=String(data.get('status')||'active');
if(!name||name.length>40)return {error:'请输入不超过 40 个字的客户名称。'};
if(!/^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/.test(domain))return {error:'请输入网址格式，例如 client-c.example，不要加 https://。'};
if(tenants.some(x=>x.id!==exclude&&(x.domain===domain||x.name===name)))return {error:'客户名称或网址已存在，请换一个。'};
if(!/^\d{4}-\d{2}-\d{2}$/.test(until)||!Number.isFinite(Date.parse(until)))return {error:'请选择有效的租期结束日期。'};
if(!exclude&&until<today())return {error:'新平台的租期结束日期不能早于今天。'};
return {name,domain,until,color:/^#[a-f0-9]{6}$/i.test(color)?color:'#b49354',language,headline:String(data.get('headline')||'Welcome').trim().slice(0,60),subtitle:String(data.get('subtitle')||'').trim().slice(0,100),brandTitle:String(data.get('brandTitle')||'').trim().slice(0,40),logo:data.get('logo')==='seven'?'seven':'none',cover:data.get('cover')==='classic'?'classic':'premium',status:['active','paused','draft'].includes(st)?st:'draft'};}
root.addEventListener('input',e=>{const key=e.target.dataset?.themeColor;if(!Object.hasOwn(window.RentalTheme.defaults,key)||!window.RentalTheme.valid(e.target.value)||saving||t()?.role==='viewer')return;themeDraft={tenantId:selected,values:{...(themeDraft?.tenantId===selected?themeDraft.values:window.RentalTheme.colors(t())),[key]:e.target.value}};applyTheme(themeDraft.values);const state=root.querySelector('#rd-theme-state');if(state)state.textContent='正在预览，还未保存。满意后按“保存颜色”。';});

if(e.target.id==='rd-theme'){

result=await operate('settings',{config:palette});if(result){themeDraft=null;notice='颜色已保存；这个客户的平台会使用新配色。';}
}else if(e.target.id==='rd-create'||e.target.id==='rd-settings'){
const create=e.target.id==='rd-create';const values=create?fields:{...t(),...fields};const fd=new FormData();for(const [key,value] of Object.entries(values))if(typeof value==='string')fd.set(key,value);const cfg=validate(fd,create?null:selected);if(cfg.error){showError(new Error(cfg.error));return;}
result=await operate(create?'create':'settings',{config:cfg});if(result)creating=false;
}else if(e.target.id==='mk-campaign-form')result=await operate('mk-create',{campaign:fields});
else if(e.target.id==='ai-plan-form')result=await operate('ai-plan',{plan:{mode:fields.mode,includeFAQ:fields.includeFAQ==='yes',includeDrafts:fields.includeDrafts==='yes',includeReports:fields.includeReports==='yes'}});
else if(e.target.id==='rd-grant')result=await operate('grant',{userId:fields.userId,role:fields.role},fields.tenantId);
else if(e.target.id==='rd-import'){let template;try{template=JSON.parse(fields.template);}catch{showError(new Error('模板 JSON 格式无效，请检查粘贴内容。'));return;}result=await operate('import',{name:fields.name,domain:fields.domain,template});if(result)importing=false;}
if(result)render();});

if(a==='logout'){try{const r=await fetch('/logout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:'{}'});if(!r.ok)throw new Error('退出失败，请重试。');location.href='/login';}catch(error){showError(error);}return;}

themeDraft=null;
if(a==='export-template'){const x=tenants.find(x=>x.id===id)||t();const keys=['color','deepColor','aquaColor','language','headline','subtitle','brandTitle','logo','cover','hidden'];const result=readOnly?{template:{format:'platform-brand-template',version:1,...Object.fromEntries(keys.map(k=>[k,x[k]]))}}:await operate('export',{},id);if(result){advancedOpen=true;modelText=JSON.stringify(result.template,null,2);notice='品牌模板已准备，可复制或下载；没有客户数据。';render();}return;}
if(a==='download-template'){const url=URL.createObjectURL(new Blob([modelText],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='platform-brand-template.json';link.click();URL.revokeObjectURL(url);return;}
if(a==='revoke-access'){const x=JSON.parse(id);const result=await operate('revoke',{userId:x.user_id},x.tenant_id);if(result)render();return;}
if(['clone','pause','member-add','member-toggle','game-toggle','sample','sample-fee','mock-deposit','mock-withdraw','mk-click','mk-register','mk-optin-add','mk-optin-revoke','ai-plan-revoke'].includes(a)){
const target=['clone','pause'].includes(a)?id:selected;const result=await operate(a,{id},target);if(result)render();return;}
if(a==='theme-open'){if(t()?.role==='viewer')return;selected=id||selected;view='tenant';adminTab='settings';creating=false;authMode='';}
else if(a.startsWith('view-')){view=a.slice(5);if(view==='hq'&&!identity.owner)view='tenant';creating=false;authMode='';if(view==='front'){frontPage='home';category='全部';}}
else if(a==='create')creating=true;
else if(a==='cancel-create')creating=false;
else if(a==='import-show'){advancedOpen=true;importing=true;}
else if(a==='import-close')importing=false;
else if(a==='manage'||a==='preview'){selected=id;view=a==='manage'?'tenant':'front';frontPage='home';adminTab='overview';category='全部';authMode='';}
else if(a==='admin-tab'){adminTab=id;reportOpen=false;}
else if(a==='report-open')reportOpen=!reportOpen;
else if(a==='ai-test'){root.querySelector('#rd-answer').textContent=t().ai?'模拟客服：您好，您可以使用电话号码或邮箱注册。实际 AI 尚未接入。':'这个客户的 AI 选配已关闭。';return;}
else if(a==='front-page'){frontPage=id;category=['Slots','Live','Sports','Lottery'].includes(id)?id:'全部';authMode='';}
else if(a==='category')category=id;
else if(a==='login'||a==='register')authMode=a;
else if(a==='close-auth')authMode='';
else if(a==='fake-auth'){const wasLogin=authMode==='login';authMode='';notice=wasLogin?'会员登录流程演示；尚未接入真实会员身份验证。':'会员注册流程演示；尚未建立真实会员账号。';}
else if(a==='game')notice='游戏占位，真实供应商 API 尚未连接。';
else if(a==='apk')notice='APK 尚未生成，正式版本需要应用签名和下载包。';
render();if(a==='create')root.querySelector('input[name=name]')?.focus();});
app.innerHTML='<main><section class="panel"><h2>正在载入 Master7 总部</h2><p role="status">读取已保存的客户配置……</p></section></main>';
load();
})();
