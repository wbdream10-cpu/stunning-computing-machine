<div id="rd-app"></div>
<script src="/assets/theme.js"></script>
<script>
(function(){
'use strict';
const root=document.getElementById('rental-demo-27'),app=root.querySelector('#rd-app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,id='',cls='')=>'<button type="button" class="'+cls+'" data-action="'+action+'" data-id="'+esc(id)+'">'+esc(label)+'</button>';
const pages=[['home','首页'],['Slots','Slots'],['Live','Live Casino'],['Sports','Sports'],['Lottery','Lottery'],['promotions','优惠'],['vip','VIP'],['wallet','钱包'],['download','下载']];
const games=[{name:'Slots 01',cat:'Slots'},{name:'Slots 02',cat:'Slots'},{name:'Slots 03',cat:'Slots'},{name:'Slots 04',cat:'Slots'},{name:'Live 01',cat:'Live'},{name:'Live 02',cat:'Live'},{name:'Sports',cat:'Sports'},{name:'Lottery',cat:'Lottery'}];
let page='home',category='全部',notice='',authMode='';
let config={brandTitle:'Master7',headline:'Welcome to Master7',subtitle:'PREMIUM ENTERTAINMENT EXPERIENCE',logo:'seven',cover:'premium',hidden:[],color:'#b49354',deepColor:'#123f67',aquaColor:'#b8deef'};
function auth(){return authMode?'<section class="panel gap"><div class="row"><h3>'+esc(authMode==='register'?'会员注册':'会员登录')+'</h3>'+btn('关闭','close-auth')+'</div><div class="note">会员服务待接入，目前不能注册或登录。无需填写个人资料。</div></section>':'';}
function sections(){
if(page==='wallet'||page==='deposit'||page==='withdraw')return '<section class="panel gap"><h3>'+esc({wallet:'会员钱包',deposit:'存款',withdraw:'提款'}[page])+'</h3><div class="note">资金钱包和支付服务待接入，目前不能存款、提款或查看真实余额。</div><div class="tools">'+btn('返回首页','page','home','primary')+'</div></section>';
if(page==='promotions')return '<section class="panel gap"><h3>优惠活动</h3><p class="small">正式活动与规则待发布。</p><div class="catalog">'+['新会员活动','每日活动','每周活动','每月活动'].map(z=>'<article class="game"><strong>'+z+'</strong><span class="small">活动位 · 尚未开放</span></article>').join('')+'</div></section>';
if(page==='vip')return '<section class="panel gap"><h3>VIP 中心</h3><div class="planrow"><span>会员等级</span><span>规则待发布</span></div><div class="planrow"><span>升级与权益</span><span>尚未开放</span></div></section>';
if(page==='support')return '<section class="panel gap"><h3>客服中心</h3><div class="note">客服连接入口待设置。</div></section>';
if(page==='download')return '<section class="panel gap"><h3>下载中心</h3><p>手机浏览器可直接打开此页面。</p><div class="note">Android APK 待开发与签名，目前没有安装包。</div>'+btn('返回首页','page','home','primary')+'</section>';
return '';
}
function render(){
window.RentalTheme.apply(root,config);window.RentalTheme.apply(document.body,config);
app.innerHTML='<header class="bar"><div class="brand"><b>Master7</b><span class="version">2027</span></div><span class="small">新版独立平台预览</span></header><main><div role="status">'+(notice?'<div class="note">'+esc(notice)+'</div>':'')+'</div><section class="panel"><div class="fronthead"><div class="frontidentity">'+(config.logo==='seven'?'<img class="frontend-logo" src="/assets/logo-7-128.webp" srcset="/assets/logo-7-128.webp 128w,/assets/logo-7-256.webp 256w" sizes="(max-width:500px) 44px,56px" width="56" height="56" alt="Master7 标志" decoding="async">':'')+'<span class="frontend-brand">'+esc(config.brandTitle||'Master7')+'</span></div><div class="tools">'+btn('登录','login')+btn('注册','register','','gold')+'</div></div><nav class="frontnav gap" aria-label="平台菜单">'+pages.map(([key,label])=>btn(label,'page',key,page===key?'active':'')).join('')+'</nav>'+
(page==='home'?'<div class="hero" data-cover="'+esc(config.cover==='classic'?'classic':'premium')+'"><span class="eyebrow">MASTER7 · 2027 EDITION</span><h2>'+esc(config.headline||'Welcome to Master7')+'</h2><p>'+esc(config.subtitle||'PREMIUM ENTERTAINMENT EXPERIENCE')+'</p>'+btn('浏览游戏','page','Slots','gold')+'</div><div class="quick"><button type="button" data-action="register"><strong>注册</strong><span>会员服务待接入</span></button><button type="button" data-action="page" data-id="deposit"><strong>存款</strong><span>支付服务待接入</span></button><button type="button" data-action="page" data-id="withdraw"><strong>提款</strong><span>资金钱包待接入</span></button></div>':'')+
(['home','Slots','Live','Sports','Lottery'].includes(page)?'<div class="row gap"><h3>'+esc(page==='home'?'游戏专区':page)+'</h3><span class="small">游戏入口预览</span></div><nav aria-label="游戏分类">'+['全部','Slots','Live','Sports','Lottery'].map(z=>btn(z,'category',z,z===category?'active':'')).join('')+'</nav><div class="catalog">'+games.filter((g,i)=>!config.hidden.includes(i)&&(category==='全部'||category===g.cat)).map(g=>'<button type="button" class="game" data-action="game"><i data-lucide="grid" aria-hidden="true"></i><strong>'+esc(g.name)+'</strong><span class="small">'+esc(g.cat)+' · 待接入</span></button>').join('')+'</div><p class="small">供应商游戏目录待导入，当前入口不能启动真实游戏。</p>':sections())+auth()+'<div class="frontfoot gap"><div><strong>Master7</strong><p class="small">PREMIUM ENTERTAINMENT EXPERIENCE</p></div><div><strong>会员服务</strong><div class="tools">'+btn('优惠','page','promotions')+btn('VIP','page','vip')+btn('客服','page','support')+'</div></div></div></section></main><nav class="mobile-nav" aria-label="手机快捷导航">'+[['home','首页'],['promotions','优惠'],['wallet','钱包'],['support','客服'],['download','下载']].map(([key,label])=>btn(label,'page',key,page===key?'active':'')).join('')+'</nav><footer class="footer">Master7 · 新版预览 · 游戏、会员、资金和支付服务尚未开放</footer>';
}
root.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||!root.contains(b))return;notice='';const a=b.dataset.action,id=b.dataset.id;if(a==='page'){page=id;category=['Slots','Live','Sports','Lottery'].includes(id)?id:'全部';authMode='';}else if(a==='category')category=id;else if(a==='register'||a==='login')authMode=a;else if(a==='close-auth')authMode='';else if(a==='game')notice='此入口为预览，供应商游戏 API 待接入。';render();});
render();
fetch('/api/public',{cache:'no-store',credentials:'omit'}).then(async r=>{if(!r.ok)throw new Error();const data=await r.json();const supplied=data.tenants?.[0];if(!supplied)throw new Error();const keys=['brandTitle','headline','subtitle','logo','cover','color','deepColor','aquaColor'];for(const k of keys)if(typeof supplied[k]==='string')config[k]=supplied[k];if(Array.isArray(supplied.hidden))config.hidden=supplied.hidden.filter(x=>Number.isInteger(x)&&x>=0&&x<games.length);render();}).catch(()=>{notice='平台配置暂未载入，当前显示预览外观。';render();});
})();
</script></div></body></html>
